name: Hornet checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Durable file-write tests vary with hosted Windows disk performance.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.9', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Unit tests (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v

  package:
    name: Build and installed-wheel checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and test outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/hornet-env"
          "$RUNNER_TEMP/hornet-env/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/hornet-env/bin/python" -m pip check
          "$RUNNER_TEMP/hornet-env/bin/hornet" --version
          cd "$RUNNER_TEMP"
          xvfb-run -a "$RUNNER_TEMP/hornet-env/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  distil:
    name: Distil Qt / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.9', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -c "import os,subprocess,sys; subprocess.run([sys.executable,'-m','pip','wheel','--no-deps','.','-w',os.path.join(os.environ['RUNNER_TEMP'],'distil-wheels')],check=True)"
      - name: Install Distil wheel with optional dependencies
        run: python -c "import glob,os,subprocess,sys; wheels=glob.glob(os.path.join(os.environ['RUNNER_TEMP'],'distil-wheels','*.whl')); assert len(wheels)==1; subprocess.run([sys.executable,'-m','pip','install',wheels[0]+'[distil]'],check=True)"
      - run: python -m pip check
      - name: Test installed Distil outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from importlib.metadata import distribution; ep=next(e for e in distribution('matrixswarm-hornet').entry_points if e.name=='hornet-distil'); assert callable(ep.load())"
          python -c "import os,subprocess,sys; subprocess.run([sys.executable,'-m','unittest','discover','-s',os.path.join(os.environ['GITHUB_WORKSPACE'],'tests','distil'),'-v'],check=True)"
